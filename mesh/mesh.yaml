---
default:
  environment:
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_BACKEND: "rocksdb"
    STREAMX_BLUEPRINTS_KEY_VALUE_STATE_REPOSITORY_ROCKSDB_PATH: "/var/lib/rocksdb"
descriptors:
  relay:
    type: "processing"
    containers:
      service:
        incoming:
          events: {}
        outgoing:
          relayed-events: {}

  external-references-rewriter:
    type: "processing"
    containers:
      processor:
        image: "ghcr.io/streamx-hub/streamx-blueprints/external-references-rewriter:3.0.27-native"
        incoming:
          incoming-resources: {}
        outgoing:
          outgoing-resources: {}
          download-requests: {}

  indexable-resources-producer:
    type: "processing"
    containers:
      processor:
        image: "ghcr.io/streamx-hub/streamx-blueprints/indexable-resources-producer:3.0.27-native"
        incoming:
          pages: {}
          fragments: {}
        outgoing:
          indexable-resources: {}
          indexable-resource-fragments: {}

  indexable-resources-sql-transformer:
    type: processing
    volumes:
      sqlitedb:
        size: 5Gi
    containers:
      processor:
        image: ghcr.io/streamx-hub/streamx-blueprints/indexable-resources-sql-transformer:3.0.27-native
        incoming:
          indexable-resources: { }
        outgoing:
          transformations: { }
        autoRef:
          - from: indexable-resources
            to: indexable-resources-state
            using: sync-state
        volumes:
          - sqlitedb:/var/lib/sqlitedb
        environment:
          STREAMX_BLUEPRINTS_SQL_STATE_REPOSITORY_SQLITE_PATH: /var/lib/sqlitedb

  opensearch-sink:
    type: "edge"
    containers:
      sink:
        image: "ghcr.io/streamx-hub/streamx-blueprints/web-server-sink:3.0.27-native"
        incoming:
          resources:
            initState: "delta"
        environment:
          STREAMX_BLUEPRINTS_WEB_SERVER_SINK_STORAGE_ROOT_DIRECTORY: "/srv/www"
        volumes:
        - "repository-volume:/srv/www"
        servicePorts:
        - "8083:8080"
      webserver:
        image: "registry.prod-ext.streamx.cloud/streamx-docker-hub-public-proxy/library/nginx:1.26.0"
        volumes:
        - "repository-volume:/usr/share/nginx/html"
        servicePorts:
        - "8084:80"
    volumes:
      repository-volume:
        size: "20Gi"
        persistent: true
ingestion:
  rest-ingestion:
    containers:
      proxy:
        environment:
          STREAMX_SOURCES_GITHUB_ACCEPT_IAT_FROM: "1704067200"
          STREAMX_SOURCES_EDS_ACCEPT_IAT_FROM: "1704067200"
sources:
  github:
    outgoing:
    - ref: "inbox.pages"
      produces:
      - "com.streamx.blueprints.page.published.v1"
      - "com.streamx.blueprints.page.unpublished.v1"
processing:
  indexable-resources-relay:
    descriptor: relay
    containers:
      service:
        incoming:
          events:
            ref: relay.indexable-resources
        outgoing:
          relayed-events:
            ref: outbox.indexable-resources

  indexable-resources-producer:
    descriptor: indexable-resources-producer
    containers:
      processor:
        incoming:
          incoming-resources:
            ref: inbox.pages
          fragments:
            ref: relay.fragments
        outgoing:
          indexable-resources:
            ref: relay.indexable-resources
          indexable-resource-fragments:
            ref: outbox.indexable-resource-fragments
        environment:
          QUARKUS_CONFIG_LOCATIONS: "/deployments/config/application.yaml"
        volumesFrom:
          configs:
            - "indexable-resources-producer.yaml:/deployments/config/application.yaml"

  indexable-resources-sql-transformer:
    descriptor: indexable-resources-sql-transformer
    containers:
      processor:
        incoming:
          indexable-resources:
            ref: relay.indexable-resources
        outgoing:
          transformations:
            ref: relay.data
        environment:
          QUARKUS_CONFIG_LOCATIONS: "/deployments/config/application.yaml"
        volumesFrom:
          configs:
            - "indexable-resources-sql-transformer.yaml:/deployments/config/application.yaml"
edge:
  opensearch-sink:
    descriptor: "opensearch-sink"
    containers:
      sink:
        incoming:
          indexable-resources:
            ref: "outbox.indexable-resources"
          indexable-resource-fragments:
            ref: "outbox.indexable-resource-fragments"
        environmentFrom:
          secrets:
          - "encrypted/opensearch-sink.properties"
        volumesFrom:
          configs:
          - "opensearch/service-init:/deployments/opensearch/service-init/additional"
      opensearch:
        environmentFrom:
          secrets:
          - "encrypted/opensearch-sink-opensearch.properties"
networking:
  httpRoutes:
    ingestion-route:
      rules:
      - backendRefs:
        - name: "ingestion/rest-ingestion"
          port: 8080
        matches:
        - path:
            type: "PathPrefix"
            value: "/"
    web-server-and-search-route:
      rules:
      - backendRefs:
        - name: "edge/opensearch-sink"
          port: 8082
        matches:
        - path:
            type: "PathPrefix"
            value: "/search"
      - backendRefs:
        - name: "edge/web-server-sink"
          port: 8084
        matches:
        - path:
            type: "PathPrefix"
            value: "/"
